# ============================================================================
# Mode auto-approve hook. One of four. After the shift - RESTART Claude Code
# (hooks and mode are read at session start).
#
#   strict     — allowlist-first: «which is clearly not allowed - to a regular prompt».
#                Safe default. Auto-approve read-only commands (including
#                compound), catastrophic - deny, mutations - prompt.
#
#   permissive — denylist-first: «which is not explicitly prohibited is allowed».
#                Fewer prompts. An unfamiliar command outside the denilista is approved.
#                Trusted project only.
#
#   bypass     — maximum autonomy: auto-confirm plan dialog (ExitPlanMode)
#                + approval of any commands except catastrophic ones (deny_hard).
#                To completely disable prompts, add to settings project:
#                "permissions": { "defaultMode": "bypassPermissions" }.
#                Trusted projects only/containers.
#
#   off        — off: always normal permission-flow.
# ============================================================================

MODE=strict
