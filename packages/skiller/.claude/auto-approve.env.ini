# Per-project override режима auto-approve хука (приоритет над
# ~/.claude/hooks/auto-approve/env.ini). Действует только в этом проекте.
# Хук зарегистрирован в .claude/settings.local.json (Bash + ExitPlanMode).
# После смены режима — ПЕРЕЗАПУСТИ Claude Code.
#
#   bypass — авто-подтверждение плана (ExitPlanMode) + одобрение любых
#            команд, кроме катастрофичных (deny_hard). Доверенный проект.
MODE=bypass
