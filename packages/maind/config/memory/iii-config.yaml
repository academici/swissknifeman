# Worker config agent-memory (iii-*) for node maind.
# Moved from Brain/.agentmemory/iii-config.yaml; service_name → maind.
# Ports can be overridden via env (AGENTMEMORY_PORT / AGENTMEMORY_STREAM_PORT) —
# see .env.example, so as not to conflict with another node. The daemon is launched from
# root maind, therefore ./data/* falls into maind/data/.
#
# iii-http.host — PORTABLE TEMPLATE (loopback). LAN-stage cross-machine memory (ADR-0001,
# D80) bind daemon on LAN-host address, but the address of THIS machine is NOT stored in the repository:
# it is set by the node - `memory.bind_host` in config.json (gitignored) or env AGENTMEMORY_BIND_HOST
# (`auto` = LAN-IPv4 current machine), maind substitutes it into the runtime copy
# data/iii-config.runtime.yaml. Bind `0.0.0.0` PROHIBITED (D28 — key expiry ceases to be
# fuse, maximum attack surface); not-loopback — only memory.role=host.
# Network change/company = change bind_host (+ memory.url from clients), do not edit this line. When the trigger is fired `tailscale serve` (third machine OR work outside LAN,
# ADR-0001) — host returns to `127.0.0.1` (editing is reversible in one line, see.
# docs/guide/memory.md). iii-stream (stream port) NOT bind to LAN: cross-machine store/recall/
# forget/export go only through iii-http REST, stream remains loopback-only.
workers:
  - name: iii-http
    config:
      port: 4111
      host: 127.0.0.1
      default_timeout: 180000
      cors:
        allowed_origins:
          - "http://localhost:4111"
          - "http://localhost:3113"
          - "http://127.0.0.1:4111"
          - "http://127.0.0.1:3113"
        allowed_methods: [GET, POST, PUT, DELETE, OPTIONS]
  - name: iii-state
    config:
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./data/state_store.db
  - name: iii-queue
    config:
      adapter:
        name: builtin
  - name: iii-pubsub
    config:
      adapter:
        name: local
  - name: iii-cron
    config:
      adapter:
        name: kv
  - name: iii-stream
    config:
      port: 4112
      host: 127.0.0.1
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./data/stream_store
  - name: iii-observability
    config:
      enabled: true
      service_name: maind
      exporter: memory
      sampling_ratio: 0.1
      metrics_enabled: true
      logs_enabled: true
      logs_console_output: false
