# review-gate — mode SubagentStop-quality gate (see .claude/hooks/review-gate.sh)
#
# REVIEW_GATE_MODE:
#   off    — disabled
#   warn   — advisory on failure, does not block (default)
#   strict — blocks subagent completion until repaired (exit 2)
#
# REVIEW_GATE_CMD — verification command (fast, deterministic).
#   B {{PACK_PREFIX}} phpstan NOT installed → default only Pint.
#   For a strict gate, you can add tests, but they are difficult for everyone SubagentStop.

REVIEW_GATE_MODE=warn
REVIEW_GATE_CMD={{CHECK_CMD}}
