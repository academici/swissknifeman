# ============================================================================
# run-report (SessionEnd) — архивный захват исхода прогона в .claude/runs/.
# Этот файл — ГЛОБАЛЬНЫЙ дефолт (рядом с хуком). Per-project override:
# <project>/.claude/run-report.env.ini (пишет `harness hooks --target P --run-report on`).
# После смены — перезапуск Claude Code не нужен (env читается на каждом SessionEnd).
#
#   ENABLED    — on (дефолт) / off. Kill-switch без правки settings.json. Сам факт
#                регистрации SessionEnd-хука в проекте = намерение; off глушит запись.
#   RUNS_KEEP  — сколько последних run-*.json держать в .claude/runs/ (ретеншн).
#   DIGEST     — on (дефолт) / off. После записи отчёта тихо дёрнуть `analyst digest`
#                (петля обучения: run-report → кандидат-уроки в ephemeral). Промоут в
#                память — по-прежнему человек (инвариант). off — не запускать digest.
# ============================================================================

ENABLED=on
RUNS_KEEP=30
DIGEST=on
