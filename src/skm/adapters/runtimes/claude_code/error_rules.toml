# urn:skm:runtimes:error-rules:v1 for built-in claude_code runtime adapter (P08.03).
# Evaluated in file order; first matching rule wins.

[[rules]]
runtime_id = "claude_code"
error_class = "authentication"
code = "RUNTIME_AUTH_EXPIRED"
scope = "account"
signal_any = { http_status = [401] }
signal_not_in = {}
text_contains_any = []
retryable = false
safe_message = "Claude Code authentication failed or credentials expired"
retry_after_from = "limit_resets_at"

[[rules]]
runtime_id = "claude_code"
error_class = "authentication"
code = "RUNTIME_AUTH_EXPIRED"
scope = "account"
signal_any = {}
signal_not_in = {}
text_contains_any = [
    "authentication_error",
    "invalid api key",
    "invalid x-api-key",
    "oauth token has expired",
    "not logged in",
    "please run /login",
    "failed to authenticate",
]
retryable = false
safe_message = "Claude Code authentication failed or credentials expired"
retry_after_from = "limit_resets_at"

