error_class = "rate_limit"
code = "RATE_LIMITED"
scope = "account"
signal_any = { http_status = [429] }
signal_not_in = {}
text_contains_any = []
retryable = true
safe_message = "Codex rate limit reached"
retry_after_from = "limit_resets_at"

# After the HTTP 429 rule: these phrases also appear on 429 responses, and an
# earlier text rule would classify that response as auth or quota instead.
[[rules]]
runtime_id = "codex"
error_class = "authentication"
code = "RUNTIME_AUTH_EXPIRED"
scope = "account"
signal_any = {}
signal_not_in = {}
