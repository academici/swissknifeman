# urn:skm:runtimes:capabilities:v1
runtime_id = "gemini_cli"
adapter_version = "0.1.0"
read_only_network = true

[config_isolation]
env = {}
args = []
credential_mounts = []
writable_home_dirs = []

[[self_loads]]
kind = "project_instructions"
locator = "{workdir}"
files = ["GEMINI.md", "**/GEMINI.md"]
when = "start"
suppressed_by = "never"
note = "Gemini CLI discovers context in the checkout and parent directories"

[[self_loads]]
kind = "skills"
locator = "{workdir}"
files = [".gemini/skills/**", ".agents/skills/**"]
when = "on_access"
suppressed_by = "never"
note = "Gemini CLI discovers skills in trusted workspaces"

[[records]]
capability = "headless_execution"
status = "adapted"
evidence = "Gemini CLI v0.68.0 headless protocol and offline adapter tests"
tested_runtime_version = "0.68.0"
limitations = "Single-turn API-key launch on a read-only Landlock checkout"
