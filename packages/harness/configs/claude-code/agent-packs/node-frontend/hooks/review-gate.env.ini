# review-gate — mode SubagentStop-quality gate (see .claude/hooks/review-gate.sh)
#
# REVIEW_GATE_MODE: off | warn (default) | strict (block before repair, exit 2)
# REVIEW_GATE_CMD  — fast deterministic check (typecheck+lint).
#
# VALIDATE_* — for PostToolUse-validator .claude/hooks/validate-frontend.sh
#   VALIDATE_MODE: off | warn (default) — always advisory (never blocks).
#   VALIDATE_CMD  — what to run after editing *.ts|*.vue.

REVIEW_GATE_MODE=warn
REVIEW_GATE_CMD={{CHECK_CMD}}

VALIDATE_MODE=warn
VALIDATE_CMD={{CHECK_CMD}}
