name: Validate Skills

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Монорепо: у каждого пакета свой validate.sh (py_compile + bash -n + JSON +
      # frontmatter/манифесты + тесты). Скрипты переехали из корня в packages/*/scripts/
      # при реструктуризации — CI зовёт их по новым путям.
      - name: Validate skiller (skills registry)
        run: bash packages/skiller/scripts/validate.sh

      - name: Validate harness
        run: bash packages/harness/scripts/validate.sh

      - name: Validate maind
        run: bash packages/maind/scripts/validate.sh

      - name: Validate task and plan fleet
        run: bash packages/task/scripts/validate.sh --fleet
