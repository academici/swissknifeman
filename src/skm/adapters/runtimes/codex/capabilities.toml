# urn:skm:runtimes:capabilities:v1 for built-in codex runtime adapter (P08.04).
# TOML has no null literal: every schema-nullable member carries a concrete value.
runtime_id = "codex"
adapter_version = "0.1.0"
read_only_network = false

[config_isolation]
args = []
writable_home_dirs = ["sessions", "cache", "tmp"]

[config_isolation.env]
CODEX_HOME = "{client_home}"
HOME = "{client_home}"

[[config_isolation.credential_mounts]]
source = "~/.codex/auth.json"
target = "auth.json"
required = true

[[self_loads]]
kind = "user_config"
locator = "~/.codex"
files = ["config.toml"]
when = "start"
suppressed_by = "config_isolation"
note = "Redirected to isolated client_home via CODEX_HOME and HOME"

[[self_loads]]
kind = "plugins"
locator = "~/.codex/plugins"
files = []
when = "start"
suppressed_by = "config_isolation"
note = "Suppressed by isolated CODEX_HOME"

[[self_loads]]
kind = "skills"
locator = "~/.codex/skills"
files = []
when = "start"
suppressed_by = "config_isolation"
note = "Suppressed by isolated CODEX_HOME"

[[self_loads]]
kind = "project_instructions"
locator = "{workdir}"
files = ["AGENTS.md"]
when = "start"
suppressed_by = "never"
note = "Codex reads AGENTS.md up the directory tree even under isolated CODEX_HOME"

[[self_loads]]
kind = "project_settings"
locator = "{workdir}/.codex"
files = ["config.toml"]
when = "start"
suppressed_by = "config_isolation"
note = "Untrusted worktree .codex/config.toml suppressed by isolated CODEX_HOME"

[[records]]
capability = "headless_execution"
status = "native"
evidence = "fixture:codex/stream_basic.jsonl"
