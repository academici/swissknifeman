# review-gate — deterministic architecture compliance gate on SubagentStop.
# Drives away check_command (config.json) after the subagent has completed.
#
#   off    — disabled.
#   warn   — violation → hint in context, does NOT block. ← default.
#   strict — violation → subagent block (exit 2).
#
# Per-project override: .claude/review-gate.env.ini in the project.
# After the shift - restart the session (mode read when triggered).

MODE=warn
