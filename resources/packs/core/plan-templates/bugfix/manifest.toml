schema = "urn:skm:extensions:plan-template:v1"
key = "bugfix"
version = "2.0.0"
title = "Bugfix plan"
description = "Template for bug diagnosis, targeted fix, regression tests, and verification."

[inputs_schema]
type = "object"
required = ["title", "goal"]
additionalProperties = false

[inputs_schema.properties.title]
type = "string"
minLength = 1
maxLength = 120

[inputs_schema.properties.goal]
type = "string"
minLength = 1
maxLength = 1000
