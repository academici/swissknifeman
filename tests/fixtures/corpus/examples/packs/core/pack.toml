# Builtin core pack manifest: resources/packs/core/pack.toml (spec/modules/extensions.md §4.3).
# Validated against urn:skm:extensions:pack:v1 (examples/schemas/extensions/pack.v1.json) after TOML -> JSON.
# Layout of the pack directory (every file outside these layouts is SCHEMA_INVALID "unexpected_file"):
#   pack.toml, README.md, LICENSE, CHANGELOG.md
#   agent-profiles/<key>.toml          (8 base profiles: scout, executor, executor-transparent, reviewer, triager,
#                                        advisor, researcher, registrar) + security, advisor-critic, plan-auditor; 11 total
#   prompts/shared/work_policy.md      (mandatory typed intensity/caps and bounded review instructions)
#   prompts/<role>/<name>.md            (role, task_contract, result_contract per role; shared/*)
#   skills/<key>/{SKILL.md,manifest.toml,references/**}
#   steering/<key>.md
#   workflows/<key>.toml                (reviewed-development, quick-fix, research-only, review-only, plan-audit)
#   plan-templates/<key>/{manifest.toml,template.json}   (feature, bugfix)
#   runtimes/models.toml                (resource runtime_catalog, key "models")

schema = "urn:skm:extensions:pack:v1"
slug = "core"
version = "2.0.0"
title = "SKM core pack"
description = "Neutral role profiles, prompt blocks, workflows, plan templates and the model catalog shipped with SKM."
publisher = "skm"
trust = "builtin"            # only valid for packs read from skm/_resources/packs (source "builtin")
priority = 0                 # builtin default; operator overlays use 100 and win on declared overrides
license = "Apache-2.0"
requires_skm = ">=2.0.0,<3"

# Config fragment: applied as a layer of level "pack" (only keys whose x-skm.levels contain "pack").
# The core pack keeps routing neutral: no concrete models, only classes; overlays set role_routing.
[config]
"context.max_total_tokens" = 150000
"context.budget.core" = 12000
"context.budget.supporting" = 30000
"context.budget.retrieval" = 50000
"context.skills.budget_tokens" = 8000
"runtimes.preference" = ["claude_code", "codex"]
"runtimes.admission.bounded_fix.allowed_extra_paths" = ["CHANGELOG.md", "docs/**"]
"runtimes.admission.bounded_fix.test_globs" = ["**/tests/**", "**/test_*.py"]

# Exclusive groups referenced by skills of this pack (manifest.toml exclusive_group).
[[exclusive_groups]]
name = "review-method"
max = 1
description = "One review method per step: the generic review checklist or a language-specific one, never both."

[[exclusive_groups]]
name = "python-testing"
max = 1
description = "One Python testing style per step (examples/skills/sample-skill uses it)."

[[exclusive_groups]]
name = "research-method"
max = 1
description = "One research method per researcher step."

# The core pack overrides nothing; an operator overlay that replaces a core resource must declare it, e.g.
# [[overrides]]
# kind = "agent_profile"
# key = "executor"
# reason = "Operator profile pins a longer timeout for the monorepo."
