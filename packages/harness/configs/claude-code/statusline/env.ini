# statusline context-notify — пороги, кулдаун, диагностика.
# Файл ставится один раз и НЕ перезатирается обновлением кода (как env.ini хуков).
#
#   THRESHOLDS   — полосы порога контекста в процентах, по возрастанию, через запятую.
#                  Уведомление приходит на ПЕРЕСЕЧЕНИИ полосы вверх, а не при каждом
#                  рендере выше порога. Падение процента (после /compact) сбрасывает
#                  полосу вниз — следующий подъём уведомит снова.
#   COOLDOWN_MIN — минут между уведомлениями; 0 — без кулдауна. Подавленный кулдауном
#                  переход не теряется: он сработает первым рендером после кулдауна.
#   BAR_WIDTH    — ширина бара в символах (1..40).
#   DEBUG        — true → диагностика в $XDG_RUNTIME_DIR/claude-statusline/debug.log
#                  (stderr пользователю не показывается, поэтому только файл).
#   NOTIFY_CMD   — доставка уведомления; по умолчанию ../hooks/notify/notify.sh
#                  (кросс-платформенный, ставится тем же `harness hooks --global`).

THRESHOLDS=80,90
COOLDOWN_MIN=15
BAR_WIDTH=10
DEBUG=false
