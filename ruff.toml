# Линтер — dev-инструмент, НЕ рантайм-зависимость (пакеты остаются stdlib-only).
# В CI запускается эфемерно: `pipx run ruff==0.15.19 check` — ruff не коммитится в репо,
# версия пиннуется ради детерминизма (исключает «вчера зелено, сегодня красно» без правок).
# Набор узкий: F (pyflakes — реальные баги: undefined/unused) + B (bugbear), без стиля.
target-version = "py39"   # минимум из матрицы CI; заодно гейтит B905 (zip strict= — только 3.10+)

[lint]
select = ["F", "B"]
