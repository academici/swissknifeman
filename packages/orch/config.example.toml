# orch configuration, generated from configs/config.schema.json; do not edit by hand.
# Copy into ~/.config/swissknifeman/config.toml or <project>/.swissknifeman/config.toml
# (swissknifeman config init does it) and uncomment the keys you change.
schema_version = 1

[orch]
# Execution engine used when neither a flag nor engine_by_role names one. One of: "native", "cao", "claude-only".
# engine = "native"

# Run-policy used when the scenario of a task names none. String.
# default_profile = "solo"

# Id of the plugin of the extension point orch:work-source that supplies the work. String.
# work_source = "planner-orch"

[orch.engine_by_role]
# Execution engine by role id; a role that is not listed uses the engine key.
# Engine of the role. One of: "native", "cao", "claude-only".
# example = "native"

[orch.capabilities]
# What preparation does with a capability record that is past its freshness date: warn and go on, or refuse. One of: "warn", "refuse".
# stale = "warn"

[orch.profiles]
# Extra folders with run-policy packs (one folder per policy id): absolute paths or paths starting with ~. Machine-wide: a project file cannot set it, because it makes orch read files from the listed paths. Array of strings.
# Allowed in layers: defaults, machine, invocation, flags.
# dirs = []

[orch.events]
# Whether orch emits the orch.run.* events. Boolean.
# enabled = true

[orch.conductor]
# Provider of every role whose stage names none. String.
# provider = "claude-code"

# Reviewer selector PROVIDER/MODEL[/CONTEXT][/EFFORT]. String.
# reviewer = "grok/grok-4.7/high"

# Actor PROVIDER/MODEL that registers outcomes in the work source. String.
# registrar = "orch/conductor"

# Rules for the executor of every run; the options of the pack, the phase and the item append theirs. Array of strings.
# rules = []

# What a blocked piece of work does to the run: stop it, or report it and go on. One of: "stop", "report".
# on_blocked = "stop"

[orch.conductor.limits]
# Tokens of all roles of a piece of work together; 0 means no limit. Integer >= 0.
# tokens_max = 0

# Timeout of one role run in seconds; 0 keeps the launch catalog timeout. Integer >= 0.
# stage_timeout_s = 0

# Timeout of one acceptance check in seconds. Integer >= 1.
# check_timeout_s = 1800

[orch.conductor.argv]
# Command line of a role instead of the launch catalog entry, by role id ({model}, {effort}, {cwd} and {orch} are filled in). Machine-wide: a project file cannot set it, because it chooses the commands the conductor runs.
# Command and arguments. Array of strings.
# Allowed in layers: defaults, machine, invocation, flags.
# example = []
