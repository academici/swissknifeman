# Конфиг воркеров agent-memory (iii-*) для узла maind.
# Перенесено из Brain/.agentmemory/iii-config.yaml; service_name → maind.
# Порты можно переопределить через env (AGENTMEMORY_PORT / AGENTMEMORY_STREAM_PORT) —
# см. .env.example, чтобы не конфликтовать с другим узлом. Демон запускается из
# корня maind, поэтому ./data/* ложится в maind/data/.
#
# iii-http.host — УПРАВЛЯЕМЫЙ КОНФИГ ДВИЖКА (ADR-0001, D80, P4.2): LAN-стадия cross-machine
# памяти бинденда демон НЕ на loopback, а на конкретный LAN-адрес хоста, чтобы остальные
# машины ходили к нему по сети (memory.role=client + memory.url). Bind `0.0.0.0` ЗАПРЕЩЁН
# (D28 — key expiry перестаёт быть предохранителем, максимальная поверхность атаки); адрес
# НЕ выбирается здесь произвольно — это LAN-адрес ТЕКУЩЕЙ машины (ADR-0001 п.1: хост = текущая
# машина), подтверждён владельцем при исполнении P4.2 (DHCP dynamic — при переинициализации
# сети адрес может смениться, тогда правится эта строка + memory.url клиентов; ротация ручная,
# как и секрет). При срабатывании триггера `tailscale serve` (третья машина ИЛИ работа вне LAN,
# ADR-0001) — host возвращается к `127.0.0.1` (правка обратима одной строкой, см.
# docs/guide/memory.md). iii-stream (стрим-порт) НЕ бинденд на LAN: cross-machine store/recall/
# forget/export идут только через iii-http REST, стрим остаётся loopback-only.
workers:
  - name: iii-http
    config:
      port: 4111
      host: 192.168.31.93
      default_timeout: 180000
      cors:
        allowed_origins:
          - "http://localhost:4111"
          - "http://localhost:3113"
          - "http://127.0.0.1:4111"
          - "http://127.0.0.1:3113"
        allowed_methods: [GET, POST, PUT, DELETE, OPTIONS]
  - name: iii-state
    config:
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./data/state_store.db
  - name: iii-queue
    config:
      adapter:
        name: builtin
  - name: iii-pubsub
    config:
      adapter:
        name: local
  - name: iii-cron
    config:
      adapter:
        name: kv
  - name: iii-stream
    config:
      port: 4112
      host: 127.0.0.1
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./data/stream_store
  - name: iii-observability
    config:
      enabled: true
      service_name: maind
      exporter: memory
      sampling_ratio: 0.1
      metrics_enabled: true
      logs_enabled: true
      logs_console_output: false
