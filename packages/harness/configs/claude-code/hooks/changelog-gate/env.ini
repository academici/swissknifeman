# ============================================================================
# changelog-gate (PreToolUse, matcher Bash) — ловит `git commit` содержательного типа
# (feat/fix/perf/refactor) без правки CHANGELOG среди застейдженных файлов.
# Этот файл — ГЛОБАЛЬНЫЙ дефолт (рядом с хуком). Per-project override:
# <project>/.claude/changelog-gate.env.ini (пишет `harness hooks --target P --changelog-gate MODE`).
# После смены — перезапуск Claude Code не нужен (env читается на каждый PreToolUse).
#
#   MODE — off (дефолт, хук не установлен по умолчанию) / warn (warning В КОНТЕКСТ модели
#          через hookSpecificOutput.additionalContext, не блокирует) / strict (блокирует
#          `git commit` содержательного типа без CHANGELOG, exit 2).
# ============================================================================

MODE=off
