# ============================================================================
# plan-guard (PreToolUse) — blocks/warns about a hand edit of a file generated by
# plan.py (index.md, plan.md, roadmap.md, status.md, handoff.md, open-questions.md,
# AGENTS.md, CLAUDE.md, context/**, phases/*/*/U*/brief.md) inside a directory that
# holds plan.json. Per-project override: <project>/.claude/plan-guard.env.ini
# (written by `harness hooks --target P --plan-guard MODE`).
#
#   MODE — off (default) / warn (warning, does not block) / strict (blocks
#          Edit/Write/MultiEdit with "generated by plan.py — change JSON through plan.py").
# ============================================================================

MODE=off
