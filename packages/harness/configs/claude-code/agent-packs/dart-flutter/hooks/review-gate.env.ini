# review-gate — режим SubagentStop-гейта качества (см. .claude/hooks/review-gate.sh)
#
# REVIEW_GATE_MODE: off | warn (по умолчанию) | strict (блок, exit 2)
# REVIEW_GATE_CMD  — быстрая проверка (dart analyze).
#
# VALIDATE_* — для PostToolUse .claude/hooks/validate-flutter.sh (advisory, не блокирует)
#   VALIDATE_MODE: off | warn (по умолчанию).
#   VALIDATE_CMD  — что гонять после правки *.dart.

REVIEW_GATE_MODE=warn
REVIEW_GATE_CMD={{CHECK_CMD}}

VALIDATE_MODE=warn
VALIDATE_CMD={{ANALYZE_CMD}}
