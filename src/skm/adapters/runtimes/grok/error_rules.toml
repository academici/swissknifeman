# urn:skm:runtimes:error-rules:v1 for built-in grok runtime adapter (P08.05).
# Evaluated in file order; first matching rule wins.

[[rules]]
runtime_id = "grok"
error_class = "authentication"
code = "RUNTIME_AUTH_EXPIRED"
scope = "account"
signal_any = { http_status = [401] }
signal_not_in = {}
text_contains_any = []
retryable = false
safe_message = "Grok CLI authentication failed or credentials expired"
retry_after_from = "limit_resets_at"

[[rules]]
runtime_id = "grok"
error_class = "authentication"
code = "RUNTIME_AUTH_EXPIRED"
scope = "account"
signal_any = {}
signal_not_in = {}
text_contains_any = [
    "authentication_error",
    "invalid api key",
    "invalid xai_api_key",
    "unauthorized",
    "oauth token has expired",
    "not logged in",
    "failed to authenticate",
]
retryable = false
safe_message = "Grok CLI authentication failed or credentials expired"
retry_after_from = "limit_resets_at"

