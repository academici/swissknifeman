# ============================================================================
# run-report (SessionEnd) — archived capture of the outcome of a run in .claude/runs/.
# This file is a GLOBAL default (next to the hook). Per-project override:
# <project>/.claude/run-report.env.ini (writes `harness hooks --target P --run-report on`).
# After shift - restart Claude Code not needed (env is read on each SessionEnd).
#
#   ENABLED    — on (default) / off. Kill-switch without editing settings.json. The fact itself
#                registration SessionEnd-hook in the project = intent; off mutes recording.
#   RUNS_KEEP  — how many last run-*.json keep in .claude/runs/ (retention).
#   DIGEST     — on (default) / off. After recording the report, pull quietly `analyst digest`
#                (learning loop: run-report → candidate-lessons in ephemeral). Promotion in
#                memory is still human (invariant). off — do not run digest.
# ============================================================================

ENABLED=on
RUNS_KEEP=30
DIGEST=on
