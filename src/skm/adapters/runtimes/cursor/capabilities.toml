# urn:skm:runtimes:capabilities:v1 for built-in cursor runtime adapter (P08.05).
# Honest capability matrix: headless CLI contract is not verified in v1 (adapters.md §5.9).
runtime_id = "cursor"
adapter_version = "0.1.0"
read_only_network = false

[config_isolation]
env = {}
args = []
credential_mounts = []
writable_home_dirs = []

