# Agent profile of the core source pack: resources/packs/core/agent-profiles/researcher.toml
# Schema: urn:skm:extensions:agent-profile:v1 (examples/schemas/extensions/agent-profile.v1.json);
# spec: working/spec/modules/extensions.md §4.6, context.md §4.4.1 (inheritance matrix), runtimes.md §4.3.1, §4.11.
# Legacy: packages/orch/roles/researcher.json (implementation, network allowed, ran 'orch.py research query' itself). v2: sources run in the host op context.research_query before the session; the role has no network and cites document_id values (context §5.14).
schema = "urn:skm:extensions:agent-profile:v1"
key = "researcher"
version = "2.0.0"
role = "researcher"
title = "Researcher"
description = "Turns the documents SKM retrieved from the configured research sources into claims with citations, contradictions, unknowns and follow-up queries."
result_schema = "urn:skm:execution:role-result:researcher:v1"
llm = true

# Routing class and effort; config_isolation is added by routing itself when inherit_user_global = false.
[routing]
model_class = "implementation"
effort = "medium"
required_capabilities = ["headless_execution", "structured_result"]
optional_capabilities = ["stream_events", "usage_reporting"]

[isolation]
profile = "worktree"

# policy_profile is the policy profile id (policy.md §4.5); layer only narrows it (urn:skm:policy:permission-layer:v1).
[permissions]
policy_profile = "read-only"

[permissions.layer.tools]
allow = ["fs.read"]

# Prompt blocks per block type, in render order inside the type (keys of prompt_block resources).
[prompt]
system_constraints = ["shared/system_constraints"]
run_rules = ["shared/run_rules"]
resume_note = ["shared/resume_note"]
role_contract = ["researcher/role"]
task_contract = ["shared/task_contract", "shared/work_policy"]
result_contract = ["researcher/result_contract"]
research = ["shared/raw_block"]

[context]
include = ["materials", "research", "skills"]
inherit_user_global = false
repo_instructions = "none"
repo_instruction_sections = []
skills_mode = "allowlist"
skills_include = ["research-method"]
skills_exclude = []
skills_budget_tokens = 4000
history_max_steps = 0
memory_top_k = 0
include_optional_materials = true

[context.budgets]
retrieval = 60000

[limits]
timeout_seconds = 1800
idle_timeout_seconds = 600
max_turns = 60
max_output_tokens = 16000
max_result_retries = 2
