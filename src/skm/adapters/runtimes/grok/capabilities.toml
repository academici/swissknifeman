# urn:skm:runtimes:capabilities:v1 for built-in grok runtime adapter (P08.05).
# TOML has no null literal: every schema-nullable member carries a concrete value.
runtime_id = "grok"
adapter_version = "0.1.0"
read_only_network = true

[config_isolation]
env = {}
args = []
credential_mounts = []
writable_home_dirs = []

[[self_loads]]
kind = "user_config"
locator = "~/.grok"
files = ["config.toml"]
when = "start"
suppressed_by = "never"
note = "Grok CLI has no flag to suppress ~/.grok/config.toml and requires ~/.grok auth state"

[[self_loads]]
kind = "plugins"
locator = "~/.grok/plugins"
files = []
when = "start"
suppressed_by = "never"
note = "User plugins under ~/.grok cannot be isolated"

[[self_loads]]
kind = "skills"
locator = "{workdir}"
files = [".grok/skills/**", "~/.grok/skills/**", ".claude/skills/**", "~/.agents/skills/**"]
when = "on_access"
suppressed_by = "never"
note = "Grok discovers skills from .grok, .claude, and ~/.agents"

[[self_loads]]
kind = "project_instructions"
locator = "{workdir}"
files = ["AGENTS.md", ".claude/rules/**"]
when = "start"
suppressed_by = "never"
note = "Grok loads AGENTS.md and .claude/rules without suppression flags"

[[self_loads]]
kind = "project_settings"
locator = "{workdir}/.grok"
files = [".grok/**"]
when = "start"
suppressed_by = "never"
note = "Untrusted worktree ./.grok/** settings cannot be suppressed (K16)"

[[records]]
capability = "headless_execution"
status = "adapted"
evidence = "fixture:grok/streaming-messages-json.jsonl"
tested_runtime_version = "0.1.0"
limitations = "Requires landlock or container isolation for --permission-mode bypassPermissions"
last_verified_at = "2026-10-26"

