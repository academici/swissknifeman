# ============================================================================
# pack-guard (PreToolUse) — слой 2 mutation-защиты generated-ассетов agent-packs:
# блокирует/предупреждает о правке ДО того, как она случилась.
# Этот файл — ГЛОБАЛЬНЫЙ дефолт (рядом с хуком). Per-project override:
# <project>/.claude/pack-guard.env.ini (пишет `harness hooks --target P --pack-guard MODE`).
# После смены — перезапуск Claude Code не нужен (env читается на каждый PreToolUse).
#
#   MODE — off (дефолт, хук не установлен по умолчанию) / warn (стерr-предупреждение,
#          не блокирует) / strict (блокирует Edit/Write/MultiEdit/NotebookEdit по
#          файлу с swissknifeman:generated, кроме user_owned).
# ============================================================================

MODE=off
