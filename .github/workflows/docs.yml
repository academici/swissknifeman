name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'                      # general umbrella + .vitepress config
      - 'packages/*/docs/**'           # per-package docks (source of truth)
      - 'packages/harness/configs/**'  # inlines/presets, which the docs refer to
      - 'docs/package.json'
      - 'docs/package-lock.json'
      - 'scripts/docs-sync.sh'
      - 'scripts/docs-mermaid-check.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # The site belongs to the hub: vitepress lives in docs/package.json.
      # docs:build = docs:sync (aggregates packages/<pkg>/docs → docs/<pkg>)
      # + vitepress build . → artifact in docs/.vitepress/dist.
      - run: npm ci
        working-directory: docs
      # The site renders diagrams in the browser: a broken one would deploy as an error box.
      - name: Mermaid diagrams parse
        run: node scripts/docs-mermaid-check.mjs
      - run: npm run docs:build
        working-directory: docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with:
          enablement: true   # auto-turn on Pages, if not configured (otherwise «Get Pages site failed: Not Found»)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
