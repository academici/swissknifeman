# ============================================================================
# changelog-gate (PreToolUse, matcher Bash) — catches `git commit` content type
# (feat/fix/perf/refactor) without editing CHANGELOG among the staged files.
# This file is a GLOBAL default (next to the hook). Per-project override:
# <project>/.claude/changelog-gate.env.ini (writes `harness hooks --target P --changelog-gate MODE`).
# After shift - restart Claude Code not needed (env is read for each PreToolUse).
#
#   MODE — off (default, hook not installed by default) / warn (warning IN THE CONTEXT OF THE MODEL
#          via hookSpecificOutput.additionalContext, does not block) / strict (blocks
#          `git commit` content type without CHANGELOG, exit 2).
# ============================================================================

MODE=off
