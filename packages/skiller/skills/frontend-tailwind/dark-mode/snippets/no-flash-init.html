<!--
  Fragment <head> server page template (Blade / Twig / Edge / any SSR).
  Closes the theme flash when server-side render. Pseudo-placeholders in Replace {{ }}
  with the syntax of your engine: {{ appearance }} — value cookie 'appearance'
  ('light' | 'dark' | 'system'), read on the server; default - 'system'.

  Two techniques work together:
    1. class on <html> from cookie — closes explicit selection light/dark on the server;
    2. inline-script - closes the mode 'system' on the client until the first frame
       (only the browser knows the system, the server does not see it).
-->

<!-- 1. Explicit selection comes directly from the class to HTML (needed helper "class if dark"). -->
<html lang="en" class="{{ appearance === 'dark' ? 'dark' : '' }}">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- 2. Mode 'system': set .dark synchronously BEFORE the bundle and before the content. -->
        <script>
            (function () {
                var appearance = '{{ appearance ?? "system" }}';

                if (appearance === 'system') {
                    var prefersDark = window.matchMedia(
                        '(prefers-color-scheme: dark)',
                    ).matches;

                    if (prefersDark) {
                        document.documentElement.classList.add('dark');
                    }
                }
            })();
        </script>

        <!-- Optional: the background of the page itself does not blink until loading CSS/content. -->
        <style>
            html {
                background-color: #ffffff;
            }
            html.dark {
                background-color: #0a0a0a;
            }
        </style>

        <!-- ...here <title>, application bundle (app.ts), styles... -->
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
