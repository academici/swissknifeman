# urn:skm:runtimes:capabilities:v1
runtime_id = "antigravity"
adapter_version = "0.1.0"
read_only_network = true

[config_isolation]
env = {}
args = []
credential_mounts = []
writable_home_dirs = []

[[self_loads]]
kind = "project_settings"
locator = "{workdir}"
files = [".agents/hooks.json", ".agents/mcp_config.json", ".agents/plugins/**", ".mcp.json"]
when = "start"
suppressed_by = "never"
note = "No verified disable switch for workspace customization"

[[self_loads]]
kind = "project_instructions"
locator = "{workdir}"
files = ["AGENTS.md", "GEMINI.md", ".agents/AGENTS.md", ".agents/GEMINI.md", ".agents/rules/*.md", ".agent/rules/*.md"]
when = "start"
suppressed_by = "never"
note = "Workspace and parent rules are discovered by AGY"

[[self_loads]]
kind = "skills"
locator = "{workdir}"
files = [".agents/skills/**", ".agent/skills/**"]
when = "on_access"
suppressed_by = "never"
note = "Workspace skills are discovered by AGY"

[[records]]
capability = "headless_execution"
status = "adapted"
evidence = "agy 1.5.13 --help and stream contract tests"
tested_runtime_version = "1.5.13"
limitations = "Supervised read-only Landlock launch; no tool approval bypass"
last_verified_at = "2026-11-20"

