# urn:skm:runtimes:capabilities:v1 for built-in claude_code runtime adapter (P08.03).
# TOML has no null literal: every schema-nullable member carries a concrete value.
runtime_id = "claude_code"
adapter_version = "0.1.0"
read_only_network = true

[config_isolation]
args = ["--setting-sources", "user", "--settings", "{step_dir}/settings.json"]
writable_home_dirs = ["projects", "todos", "statsig", "debug", "tmp"]

[config_isolation.env]
CLAUDE_CONFIG_DIR = "{client_home}"
HOME = "{client_home}"
CLAUDE_CODE_DISABLE_CLAUDE_MDS = "1"
CLAUDE_CODE_DISABLE_AUTO_MEMORY = "1"

[[config_isolation.credential_mounts]]
source = "~/.claude/.credentials.json"
target = ".credentials.json"
required = true

[[self_loads]]
kind = "user_config"
locator = "~/.claude"
files = ["settings.json", "CLAUDE.md"]
when = "start"
suppressed_by = "config_isolation"
note = "Redirected to isolated client_home via CLAUDE_CONFIG_DIR and HOME"

[[self_loads]]
kind = "plugins"
locator = "~/.claude/plugins"
files = []
when = "start"
suppressed_by = "config_isolation"
note = "Suppressed by isolated CLAUDE_CONFIG_DIR and --safe-mode when supported"

[[self_loads]]
kind = "project_instructions"
locator = "{workdir}"
files = ["CLAUDE.md", ".claude/CLAUDE.md"]
when = "start"
suppressed_by = "config_isolation"
note = "Suppressed via CLAUDE_CODE_DISABLE_CLAUDE_MDS=1"

[[self_loads]]
kind = "project_settings"
locator = "{workdir}/.claude"
files = ["settings.json", "settings.local.json"]
when = "start"
suppressed_by = "config_isolation"
note = "Untrusted worktree hooks and allow-rules suppressed by omitting project/local from --setting-sources (K16)"

[[self_loads]]
kind = "skills"
locator = "{workdir}/.claude"
files = [".claude/skills/**", ".claude/agents/**"]
when = "on_access"
suppressed_by = "never"
note = "Suppressed when --safe-mode is verified; otherwise reported via self_loaded_context"

