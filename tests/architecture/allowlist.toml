# Trusted operator migration files and checked MigrationSession SQL. Each entry pins one exact call in runner.py (and
# rejects it when a name of the call is assigned in its function), so interpolating a value elsewhere still fails.
[[allow]]
rule = "no-fstring-sql"
path = "src/skm/adapters/postgres/migrations/runner.py"
detail = "SQL uses external data as syntax: bind values as parameters; use constant identifier allowlists"
statement = 'self._conn.execute(cast("str", sql), cast("psycopg.abc.Params | None", params))'
reason = "MigrationSession.execute runs SQL that check_migration_sql already screened; the text is a parameter and values travel as params."
adr = "working/spec/adapters.md §1.10"

[[allow]]
rule = "no-fstring-sql"
path = "src/skm/adapters/postgres/migrations/runner.py"
detail = "SQL uses external data as syntax: bind values as parameters; use constant identifier allowlists"
statement = 'cursor.executemany(cast("str", sql), cast("Iterable[psycopg.abc.Params]", params))'
reason = "MigrationSession.executemany runs SQL that check_migration_sql already screened; values travel as params."
adr = "working/spec/adapters.md §1.10"

[[allow]]
rule = "no-fstring-sql"
path = "src/skm/adapters/postgres/migrations/runner.py"
detail = "SQL uses external data as syntax: bind values as parameters; use constant identifier allowlists"
statement = 'cursor.execute(cast("str", sql), cast("psycopg.abc.Params | None", params))'
reason = "MigrationSession.fetchall runs SQL that check_migration_sql already screened; values travel as params."
adr = "working/spec/adapters.md §1.10"

[[allow]]
rule = "no-fstring-sql"
path = "src/skm/adapters/postgres/migrations/runner.py"
detail = "SQL uses external data as syntax: bind values as parameters; use constant identifier allowlists"
statement = 'conn.execute(_bootstrap_sql(self._database))'
reason = "The packaged runner_bootstrap.sql file, a constant resource."
adr = "working/spec/adapters.md §1.10"

[[allow]]
rule = "no-fstring-sql"
path = "src/skm/adapters/postgres/migrations/runner.py"
detail = "SQL uses external data as syntax: bind values as parameters; use constant identifier allowlists"
statement = 'conn.execute(cast("str", source))'
reason = "A migration file body that was screened and checksum-verified in _preflight; a trusted operator file."
adr = "working/spec/adapters.md §1.10"

# P09.04.c: context §13 exposes this pure host helper through its public facade.
[[allow]]
rule = "layer-imports"
path = "src/skm/modules/context/public.py"
detail = "import of 'skm.modules.context.host.collect_host_blocks.collect_host_blocks' (host) is not allowed from public"
reason = "The context owner explicitly exposes collect_host_blocks through public.py; it receives the reader and estimator and is not a registered host operation."
adr = "working/spec/modules/context.md §§7.3, 13"

# These are explicitly passed pure values, not access to the control-plane gateway table.
[[allow]]
rule = "host-boundary"
path = "src/skm/modules/context/host/collect_host_blocks.py"
detail = "host operation imports 'skm.kernel.tokens.TokenEstimator': talk to the control plane via ctx.client"
reason = "The pure deterministic estimator is an explicit collect_host_blocks argument, as required by kernel/tokens.py and the context owner."
adr = "working/spec/modules/context.md §7.3; working/spec/kernel-platform.md §2.11c"

[[allow]]
rule = "host-boundary"
path = "src/skm/modules/context/host/collect_host_blocks.py"
detail = "host operation imports 'skm.modules.context.ports.ReadOutcome': talk to the control plane via ctx.client"
reason = "ReadOutcome is the inert result DTO of the host CheckoutReader, not a repository or control-plane gateway."
adr = "working/spec/modules/context.md §§4.2, 5.8, 6"

[[allow]]
rule = "config-access"
path = "src/skm/modules/context/domain/deps.py"
detail = "environment/TOML access outside config sources: use ctx.config"
reason = "The owning pure domain function parses caller-supplied pyproject.toml text with tomllib.loads; it reads no configuration files or environment."
adr = "working/spec/modules/context.md §§5.8, 7.3"

