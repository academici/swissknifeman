# review-gate — детерминированный гейт соблюдения архитектуры на SubagentStop.
# Прогоняет check_command (config.json) после завершения субагента.
#
#   off    — выключено.
#   warn   — нарушение → подсказка в контекст, НЕ блокирует. ← дефолт.
#   strict — нарушение → блок субагента (exit 2).
#
# Per-project override: .claude/review-gate.env.ini в проекте.
# После смены — перезапусти сессию (режим читается при срабатывании).

MODE=warn
