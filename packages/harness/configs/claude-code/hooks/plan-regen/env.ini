# plan-regen (PostToolUse) — after an Edit/Write/MultiEdit of a *.json inside a plan directory
# (nearest ancestor with plan.json) run `plan.py check`, then `plan.py render`.
# Check errors (first 5) are returned to the agent and nothing is rendered.
# Per-project switch: <project>/.claude/plan-regen.env.ini (`harness hooks --target P --plan-regen on|off`).
#
#   MODE — off (default) / on

MODE=off
