# review-gate — mode SubagentStop-quality gate (see .claude/hooks/review-gate.sh)
#
# REVIEW_GATE_MODE: off | warn (default) | strict (block, exit 2)
# REVIEW_GATE_CMD  — quick check (dart analyze).
#
# VALIDATE_* — for PostToolUse .claude/hooks/validate-flutter.sh (advisory, does not block)
#   VALIDATE_MODE: off | warn (default).
#   VALIDATE_CMD  — what to run after editing *.dart.

REVIEW_GATE_MODE=warn
REVIEW_GATE_CMD={{CHECK_CMD}}

VALIDATE_MODE=warn
VALIDATE_CMD={{ANALYZE_CMD}}
