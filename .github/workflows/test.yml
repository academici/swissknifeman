name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Монорепо: тесты по пакету (каждый знает свой core через PYTHONPATH) + smoke
      # пакета core. Скрипты переехали из корня в packages/*/scripts/ при реструктуризации.
      - name: Test skiller
        run: bash packages/skiller/scripts/test.sh -v

      - name: Test harness
        run: bash packages/harness/scripts/test.sh -v

      - name: Test maind
        run: bash packages/maind/scripts/test.sh -v

      - name: Test core (stdlib фундамент)
        run: PYTHONPATH=. python3 -m unittest discover -s core/tests -v
