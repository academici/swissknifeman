name: Set up Python and the locked environment
description: Install uv with its cache keyed on uv.lock, then sync the frozen environment for one Python version.

inputs:
  python-version:
    description: Python version to install and sync.
    required: true

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: uv.lock
        # Keep pre-built wheels: the packaging tests run `uv build` offline and need hatchling from the cache,
        # which `uv cache prune --ci` would drop before the cache is saved.
        prune-cache: false
        # A new key: entries saved before pruning was turned off lack those wheels and would keep restoring.
        cache-suffix: unpruned
    - name: Sync the locked environment
      shell: bash
      run: uv sync --frozen
