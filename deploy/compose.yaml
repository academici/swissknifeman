name: skm-server

x-app-image: &app-image
  image: skm-api:${SKM_IMAGE_TAG:-local}
  pull_policy: never
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]

x-migrator-environment: &migrator-environment
  SKM_DATABASE_URL: "postgresql://skm_migrator_login:${SKM_PG_MIGRATOR_PASSWORD:-}@postgres/skm_projects"

services:
  postgres:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    user: "999:999"
    environment:
      POSTGRES_DB: skm_projects
      POSTGRES_PASSWORD: ${SKM_PG_ADMIN_PASSWORD:-}
      SKM_PG_MIGRATOR_PASSWORD: ${SKM_PG_MIGRATOR_PASSWORD:-}
      SKM_PG_APP_PASSWORD: ${SKM_PG_APP_PASSWORD:-}
      TZ: UTC
      PGTZ: UTC
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${POSTGRES_PASSWORD:?Set SKM_PG_ADMIN_PASSWORD}"
        : "$${SKM_PG_MIGRATOR_PASSWORD:?Set SKM_PG_MIGRATOR_PASSWORD}"
        : "$${SKM_PG_APP_PASSWORD:?Set SKM_PG_APP_PASSWORD}"
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      - source: postgres-roles
        target: /docker-entrypoint-initdb.d/01-roles.sh
    networks: [database]
    healthcheck:
      # The entrypoint's temporary initialization server only listens on a Unix socket.
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, postgres, -d, skm_projects]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app-image
    command: [db, migrate]
    environment: *migrator-environment
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Explicit first-install operator step. The owner token stays in this service's private volume.
  init:
    <<: *app-image
    profiles: [setup]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        skm init --state-dir /var/lib/skm --blobs-root /var/lib/skm/blobs --host-name skm-server
        python - <<'PY'
        from pathlib import Path
        from shutil import copyfile

        root = Path("/var/lib/skm")
        profile = root / "bootstrap.toml"
        text = profile.read_text()
        if "/secrets/token-pepper" in text:
            pepper = root / "token-pepper"
            copyfile(root / "secrets/token-pepper", pepper)
            pepper.chmod(0o600)
        replacement = profile.with_suffix(".tmp")
        replacement.write_text(text.replace("/secrets/token-pepper", "/token-pepper")
                                   .replace("migrate_on_start = true", "migrate_on_start = false"))
        replacement.chmod(0o600)
        replacement.replace(profile)
        PY
        skm config set --scope instance --yes --reason "Compose API settings" \
          api.allowed_hosts "$$SKM_API_ALLOWED_HOSTS"
        skm config set --scope instance --yes --reason "Compose API settings" \
          api.cors.origins "$$SKM_API_CORS_ORIGINS"
    environment:
      SKM_DATABASE_URL: "postgresql://skm_app_login:${SKM_PG_APP_PASSWORD:-}@postgres/skm_projects"
      SKM_DATABASE_MIGRATOR_URL: "postgresql://skm_migrator_login:${SKM_PG_MIGRATOR_PASSWORD:-}@postgres/skm_projects"
      SKM_BOOTSTRAP: /var/lib/skm/bootstrap.toml
      SKM_API_ALLOWED_HOSTS: "${SKM_API_ALLOWED_HOSTS:-[\"api:8765\",\"localhost:8765\",\"127.0.0.1:8765\"]}"
      SKM_API_CORS_ORIGINS: "${SKM_API_CORS_ORIGINS:-[]}"
    volumes:
      - api-state:/var/lib/skm
      - owner-secrets:/var/lib/skm/secrets
    networks: [database]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *app-image
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      SKM_BOOTSTRAP: /var/lib/skm/bootstrap.toml
      SKM_DATABASE_URL: "postgresql://skm_app_login:${SKM_PG_APP_PASSWORD:-}@postgres/skm_projects"
    ports:
      - "127.0.0.1:${SKM_API_PORT:-8765}:8765"
    networks: [database, worker-api, frontend]
    volumes:
      - api-state:/var/lib/skm
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/health/ready', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    <<: *app-image
    image: skm-worker:${SKM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.worker
      additional_contexts:
        skm_package: service:api
    environment:
      SKM_BOOTSTRAP: /var/lib/skm/bootstrap.toml
      SKM_WORKSPACE: ${SKM_WORKER_WORKSPACE:-}
    networks: [worker-api]
    volumes:
      - worker-state:/var/lib/skm
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  database:
    internal: true
  worker-api:
    internal: true
  frontend: {}

volumes:
  postgres-data: {}
  api-state: {}
  owner-secrets: {}
  worker-state: {}

configs:
  postgres-roles:
    content: |
      # Sourced by the official Postgres entrypoint during initialization of an empty volume.
      : "$${SKM_PG_MIGRATOR_PASSWORD:?Set SKM_PG_MIGRATOR_PASSWORD}"
      : "$${SKM_PG_APP_PASSWORD:?Set SKM_PG_APP_PASSWORD}"

      docker_process_sql <<'SQL'
      \getenv migrator_password SKM_PG_MIGRATOR_PASSWORD
      \getenv app_password SKM_PG_APP_PASSWORD
      BEGIN;
      CREATE ROLE skm_migrator NOLOGIN;
      CREATE ROLE skm_app NOLOGIN;
      CREATE ROLE skm_migrator_login LOGIN PASSWORD :'migrator_password' IN ROLE skm_migrator;
      CREATE ROLE skm_app_login LOGIN PASSWORD :'app_password' IN ROLE skm_app;
      REVOKE ALL ON DATABASE skm_projects, postgres, template0, template1 FROM PUBLIC;
      REVOKE ALL ON SCHEMA public FROM PUBLIC;
      GRANT USAGE ON SCHEMA public TO skm_migrator, skm_app;
      GRANT CONNECT, CREATE ON DATABASE skm_projects TO skm_migrator;
      GRANT CONNECT ON DATABASE skm_projects TO skm_app;
      COMMIT;
      SQL
