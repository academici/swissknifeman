# ============================================================================
# Mode «unified memory» — what backend does it use? memory.sh. One of five.
# After the shift - restart the session (mode read when called).
#
#   maind       — delegates to `maind memory` (demon :4111). Isolation by scope —
#                 on the side maind (demon pool one, namespace it does NOT filter):
#                 private project:<id> + general ns:<tag> + global; recall them
#                 combines. brain is ignored, scope is taken from the project.
#                 ← recommended for application projects (same memory as MCP).
#
#   file        — one common store on brain (flat markdown-facts). Easier
#                 total: remember writes a fact + index, recall rattles store.
#
#   federation  — source of truth = OWN memory/ each participant (him
#                 .claude/memory + native memory Claude Code) + general store.
#                 recall reads ALL participants and ranks by matches.
#                 Git-transparent, no daemon. ← default.
#
#   agentmemory — remember/recall via HTTP AgentMemory (demon on Brain,
#                 namespace = name brain). Semantic search; if the demon is sleeping -
#                 status reports honestly, without falling.
#
#   off         — disabled: remember/recall do nothing.
# ============================================================================

MODE=federation
