name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'                      # general umbrella + .vitepress config
      - 'packages/*/docs/**'           # per-package docks (source of truth)
      - 'packages/harness/configs/**'  # inlines/presets, which the docs refer to
      - 'docs/package.json'
      - 'docs/package-lock.json'
      - 'scripts/docs-sync.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # The site belongs to the hub: vitepress lives in docs/package.json.
      # docs:build = docs:sync (aggregates packages/<pkg>/docs → docs/<pkg>)
      # + vitepress build . → artifact in docs/.vitepress/dist.
      - run: npm ci
        working-directory: docs
      - run: npm run docs:build
        working-directory: docs
      - uses: actions/configure-pages@v4
        with:
          enablement: true   # auto-turn on Pages, if not configured (otherwise «Get Pages site failed: Not Found»)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
