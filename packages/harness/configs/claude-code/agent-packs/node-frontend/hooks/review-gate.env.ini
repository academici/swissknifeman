# review-gate — режим SubagentStop-гейта качества (см. .claude/hooks/review-gate.sh)
#
# REVIEW_GATE_MODE: off | warn (по умолчанию) | strict (блок до починки, exit 2)
# REVIEW_GATE_CMD  — быстрая детерминированная проверка (typecheck+lint).
#
# VALIDATE_* — для PostToolUse-валидатора .claude/hooks/validate-frontend.sh
#   VALIDATE_MODE: off | warn (по умолчанию) — всегда advisory (никогда не блокирует).
#   VALIDATE_CMD  — что гонять после правки *.ts|*.vue.

REVIEW_GATE_MODE=warn
REVIEW_GATE_CMD={{CHECK_CMD}}

VALIDATE_MODE=warn
VALIDATE_CMD={{CHECK_CMD}}
