name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Монорепо: тесты по пакету (каждый знает свой core через PYTHONPATH) + smoke
      # пакета core. Скрипты переехали из корня в packages/*/scripts/ при реструктуризации.
      - name: Test skiller
        run: bash packages/skiller/scripts/test.sh -v

      - name: Test harness
        run: bash packages/harness/scripts/test.sh -v

      - name: Test maind
        run: bash packages/maind/scripts/test.sh -v

      - name: Test core (stdlib фундамент)
        run: PYTHONPATH=. python3 -m unittest discover -s core/tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Линтер эфемерно через pipx (предустановлен на runner'е) — ruff НЕ зависимость
      # репо, версия пиннована (детерминизм). Набор F,B — конфиг в ruff.toml.
      - name: Ruff (баги — pyflakes F + bugbear B)
        # lib + tests: раньше линтовался только lib/, и в tests/ копился мусор (неиспользуемые
        # импорты/переменные). Теперь оба — чтобы тестовый код держал ту же планку.
        run: pipx run ruff==0.15.19 check core/ core/tests packages/skiller/lib packages/skiller/tests packages/harness/lib packages/harness/tests packages/maind/lib packages/maind/tests
