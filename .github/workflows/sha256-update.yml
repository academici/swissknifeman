name: Registry hashes

# The registry is regenerated by its author (`skiller registry`) and reviewed in the PR; CI only proves it is current.
# This workflow used to commit and push regenerated files straight to main, past review (and its paths, from before
# the move to packages/skiller, never matched). The same check also runs in the skiller unit of modules.yml.
on:
  push:
    branches: [main, master]
    paths:
      - 'packages/skiller/skills/**'
      - 'packages/skiller/generate-skill/**'
      - 'packages/skiller/buckets.json'
  pull_request:
    branches: [main, master]
    paths:
      - 'packages/skiller/skills/**'
      - 'packages/skiller/generate-skill/**'
      - 'packages/skiller/buckets.json'

permissions:
  contents: read

jobs:
  registry-current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Registry and plugin manifests are current
        run: ./packages/skiller/bin/skiller registry --check
