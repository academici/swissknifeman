# ============================================================================
# Режим agent-router (пара хуков UserPromptSubmit + SessionStart). После смены —
# ПЕРЕЗАПУСТИ Claude Code (хуки и режим читаются при старте сессии).
#
#   propose       — дефолт: на задачу модель ПРЕДЛАГАЕТ готовую /task:* строку в
#                   консоль (human-in-loop), запускаешь сам. Надёжно, без оверфайра.
#
#   auto_dispatch — то же + для БЕЗОПАСНЫХ задач модель может сама вызвать /task:*
#                   через SlashCommand (pin модели/effort применится). Рискованное —
#                   всё равно предлагает. Осознанная автономия для доверенных проектов.
#
#   off           — выключено: обычный флоу, подсказки не инжектятся.
#
# THRESHOLD     — минимальная сумма весов ключевых слов, чтобы показать bias-подсказку
#                 (UserPromptSubmit). Ниже порога → тишина. Выше = меньше шума.
# ESCAPE_PREFIX — префикс промпта, отключающий подсказку на ОДНО сообщение
#                 (per-turn «нет»). Пусто = выключить escape-hatch.
#
# Per-project override: <project>/.claude/agent-router.env.ini (перебивает по ключу).
# ============================================================================

POLICY=propose
THRESHOLD=2
ESCAPE_PREFIX=~
