name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Monorepo: package tests (everyone knows their core through PYTHONPATH) + smoke
      # package core. Scripts moved from root to packages/*/scripts/ during restructuring.
      - name: Test skiller
        run: bash packages/skiller/scripts/test.sh -v

      - name: Test harness
        run: bash packages/harness/scripts/test.sh -v

      - name: Test maind
        run: bash packages/maind/scripts/test.sh -v

      - name: Test orch contracts
        run: bash packages/orch/scripts/test.sh -v

      - name: Test aicore (stdlib foundation)
        run: bash packages/aicore/scripts/test.sh -v

      - name: Test core (transitional shim)
        run: PYTHONPATH=. python3 -m unittest discover -s core/tests -v

  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test and validate every module in an isolated copy
        run: python3 scripts/ecosystem-units.py standalone --baseline

  task:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest, midpoint and newest supported runtimes catch compatibility
        # drift without repeating the full package/static gate five times.
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate task
        run: bash packages/task/scripts/validate.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Linter ephemerally through pipx (preinstalled on runner'e) — ruff NOT an addiction
      # repo, pinnovana version (determinism). Kit F,B — config in ruff.toml.
      - name: Ruff (bugs — pyflakes F + bugbear B)
        # lib + tests: Previously it was only linted lib/, and in tests/ garbage was piling up (unused
        # imports/variables). Now both — so that the test code maintains the same level.
        run: bash scripts/lint.sh
