# ============================================================================
# pack-guard (PreToolUse) — layer 2 mutation-protection generated-assets agent-packs:
# blocks/warns about an edit BEFORE it happens.
# This file is a GLOBAL default (next to the hook). Per-project override:
# <project>/.claude/pack-guard.env.ini (writes `harness hooks --target P --pack-guard MODE`).
# After shift - restart Claude Code not needed (env is read for each PreToolUse).
#
#   MODE — off (default, hook not installed by default) / warn (erasedr-warning,
#          does not block) / strict (blocks Edit/Write/MultiEdit/NotebookEdit by
#          file with swissknifeman:generated, except user_owned).
# ============================================================================

MODE=off
