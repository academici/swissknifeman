name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'                      # общее зонтика + .vitepress конфиг
      - 'packages/*/docs/**'           # per-package доки (источник истины)
      - 'packages/harness/configs/**'  # инлайны/пресеты, на которые ссылаются доки
      - 'packages/skiller/package.json'
      - 'scripts/docs-sync.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/skiller/package-lock.json
      # docs-тулинг (vitepress) живёт в packages/skiller (root package.json нет —
      # монорепо). docs:build = docs:sync (агрегирует packages/<pkg>/docs → docs/<pkg>)
      # + vitepress build ../../docs → артефакт в <repo>/docs/.vitepress/dist.
      - run: npm ci
        working-directory: packages/skiller
      - run: npm run docs:build
        working-directory: packages/skiller
      - uses: actions/configure-pages@v4
        with:
          enablement: true   # авто-включить Pages, если не настроены (иначе «Get Pages site failed: Not Found»)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
