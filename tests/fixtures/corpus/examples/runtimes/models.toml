# Model catalog of the core pack: src/skm/_resources/packs/core/runtimes/models.toml
# (resource kind runtime_catalog, key "models"; schema urn:skm:runtimes:model-catalog:v1; spec runtimes.md §4.2).
# Migrated from packages/aicore/configs/model-catalog.json (catalog_version 1.0.0) WITHOUT the owner's personal pool
# extension of 2026-10-01 (claude_code "fable", codex "gpt-6.1-sol", cursor family patterns): that goes to the
# owner's overlay pack (role_routing / an operator runtime_catalog that overrides this resource).
# Legacy "roles" mixed classes and hints: classes = {economy, implementation, frontier} ∩ roles;
# suited_roles: explore -> scout, researcher; implementation -> executor; review -> reviewer, triager;
# design -> advisor; audit -> reviewer.
# Prices: the legacy catalog has none ("No price table, no currency"). pricing stays absent until verified;
# cost_usd_micros is then null and budgets in usd follow budgets.unknown_usage_policy.
# context_window_tokens: new data. Values marked status = "unverified" are conservative placeholders that P09.02
# must verify against provider documentation before the catalog is published (the doctor warns while unverified).
schema = "urn:skm:runtimes:model-catalog:v1"
catalog_version = "2.0.0"

[runtimes.claude_code]
class_selectors = { economy = ["haiku"], implementation = ["sonnet"], frontier = ["opus"] }
effort_selectors = { low = "low", medium = "medium", high = "high", xhigh = "xhigh" }
inventory_verified_at = 2026-09-17
inventory_source = "claude --help @ 2.1.266"

[[runtimes.claude_code.models]]
id = "haiku"
display_name = "Claude Haiku (CLI alias)"
classes = ["economy"]
suited_roles = ["scout", "researcher", "registrar"]
context_window_tokens = 200000
patterns = [".*haiku.*"]
status = "confirmed"
verified_at = 2026-09-17
source = "claude --help @ 2.1.266"
notes = "Alias resolved by the CLI to the current Haiku model."

