# statusline context-notify — thresholds, cooldown, diagnostics.
# The file is installed once and is NOT overwritten by updating the code (like env.ini hooks).
#
#   THRESHOLDS   — context threshold bars in percentage, ascending, separated by commas.
#                  The notification comes when CROSSING the lane up, and not every time
#                  rendering above threshold. Falling percentage (after /compact) resets
#                  lane down - the next rise will notify again.
#   COOLDOWN_MIN — minutes between notifications; 0 - no cooldown. Suppressed by cooldown
#                  the transition is not lost: it will fire as the first render after the cooldown.
#   BAR_WIDTH    — bar width in characters (1..40).
#   DEBUG        — true → diagnostics in $XDG_RUNTIME_DIR/claude-statusline/debug.log
#                  (stderr is not shown to the user, so only the file).
#   NOTIFY_CMD   — notification delivery; default../hooks/notify/notify.sh
#                  (cross-platform, installed by the same `harness hooks --global`).

THRESHOLDS=80,90
COOLDOWN_MIN=15
BAR_WIDTH=10
DEBUG=false
