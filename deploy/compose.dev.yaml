# Development and test PostgreSQL only.
name: skm-dev
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: skm
      POSTGRES_PASSWORD: skm_dev
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "max_connections=200", "-c", "log_min_duration_statement=500", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - skm-dev-pg:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skm -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  skm-dev-pg: {}
