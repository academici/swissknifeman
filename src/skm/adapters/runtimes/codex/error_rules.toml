# urn:skm:runtimes:error-rules:v1 for built-in codex runtime adapter (P08.04).
# Evaluated in file order; first matching rule wins.

[[rules]]
runtime_id = "codex"
error_class = "authentication"
code = "RUNTIME_AUTH_EXPIRED"
scope = "account"
signal_any = { http_status = [401] }
signal_not_in = {}
text_contains_any = []
retryable = false
safe_message = "Codex authentication failed or credentials expired"
retry_after_from = "limit_resets_at"

[[rules]]
runtime_id = "codex"
error_class = "authentication"
code = "RUNTIME_AUTH_EXPIRED"
scope = "account"
signal_any = {}
signal_not_in = {}
text_contains_any = [
    "not logged in",
    "failed to authenticate",
    "invalid api key",
    "auth.json is missing or corrupted",
    "401 unauthorized",
]
retryable = false
safe_message = "Codex authentication failed or credentials expired"
retry_after_from = "limit_resets_at"

