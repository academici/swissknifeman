name: Hygiene

on:
  push:
    branches: [main, master]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main, master]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — default checkout@v4 (fetch-depth: 1) does not lay the base PR to clone
      # (in t.h. For fork-PR); docs-impact.py diff by merge-base, he needs the full story.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: docs-impact (PR)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/docs-impact.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: docs-impact (push)
        if: github.event_name == 'push'
        run: python3 scripts/docs-impact.py --base HEAD~1 --head HEAD

      - name: Test docs-impact gate
        run: python3 scripts/test-docs-impact.py -v

      - name: managed-blocks (canonical exports ↔ generated copies)
        run: |
          python3 scripts/test-sync-managed-blocks.py -v
          python3 scripts/sync-managed-blocks.py --check --root .

      - name: config-inventory (owner + consumer per config)
        run: python3 scripts/test-config-inventory.py -v

      - name: status-check (capability matrix)
        run: |
          python3 scripts/test-status-check.py -v
          python3 scripts/status-check.py docs/status.md

      - name: public-hygiene (forbidden paths in a tree)
        run: |
          python3 scripts/test-public-hygiene.py -v
          python3 scripts/public-hygiene.py

      - name: provider-docs (conformity of the manifesto of providers' capabilities)
        run: |
          python3 scripts/test-provider-docs.py -v
          python3 scripts/provider-docs.py --check

      - name: Skiller host bindings (Task release surfaces, root installers)
        run: |
          python3 scripts/test-task-plugin-cache-revision.py -v
          python3 scripts/test-root-install.py -v

      - name: dev-clone guard (entry points, scripts/dev-clone.sh)
        run: python3 scripts/test-dev-guard.py -v

      - name: dev-sandbox (scripts/dev-sandbox.sh)
        run: python3 scripts/test-dev-sandbox.py -v

      - name: ecosystem-units (manifests, ownership map, schemas, boundaries against the baseline)
        run: |
          python3 scripts/test-ecosystem-units.py -v
          python3 scripts/ecosystem-units.py check
          python3 scripts/ecosystem-units.py render --check

      - name: agent-framework freshness (Skiller canon ↔ Harness pack.json)
        run: |
          python3 scripts/test-agent-framework-freshness.py -v
          python3 scripts/agent-framework-freshness.py

  release-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Immutable tuples are compared with earlier source tags.

      - name: verify-tag (tag ↔ CHANGELOG.md)
        run: |
          python3 scripts/test-verify-tag.py -v
          python3 scripts/test-version-guard.py -v
          python3 scripts/verify-tag.py "${GITHUB_REF_NAME}"
