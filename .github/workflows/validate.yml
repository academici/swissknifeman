name: Validate Skills

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Monorepo: each package has its own validate.sh (py_compile + bash -n + JSON +
      # frontmatter/manifestos + tests). Scripts moved from root to packages/*/scripts/
      # during restructuring — CI calls them along new paths.
      - name: Validate skiller (skills registry)
        run: bash packages/skiller/scripts/validate.sh

      - name: Validate harness
        run: bash packages/harness/scripts/validate.sh

      - name: Validate planner and plan fleet
        run: bash packages/planner/scripts/validate.sh --fleet

      - name: Validate orch contracts
        run: bash packages/orch/scripts/validate.sh

  # maind is an auxiliary tool outside the core verification; its validation never blocks the core.
  tools:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate maind
        run: bash packages/maind/scripts/validate.sh
